<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 650" role="img"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08162c"/><stop offset=".55" stop-color="#0d2650"/><stop offset="1" stop-color="#102c5d"/></linearGradient><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1d3c75"/><stop offset="1" stop-color="#153053"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#3979ff"/><stop offset="1" stop-color="#62d7fe"/></linearGradient></defs><rect width="1240" height="650" fill="url(#bg)"/><circle cx="1250" cy="0" r="440" fill="#28599c" opacity=".14"/><circle cx="100" cy="670" r="380" fill="#459cef" opacity=".065"/><path d="M0 590 H1240" stroke="#ffffff" opacity=".045"/>
 <rect x="60" y="61" width="244" height="32" rx="12" fill="#1b3152" stroke="none"/><text x="72" y="83" fill="#80b7ff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" text-anchor="start">05 / VALIDATE THE RESULT</text>
 <text x="60" y="153" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="43" font-weight="800" text-anchor="start">Root sementara harus diverifikasi</text>
 <text x="60" y="193" fill="#b5d2f1" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="500" text-anchor="start">Gunakan root manager dan terminal yang sudah mendapat izin su.</text>
