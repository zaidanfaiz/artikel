 <rect x="66" y="239" width="1110" height="48" rx="22" fill="#18314f" stroke="none"/>
 <rect x="86" y="255" width="16" height="16" rx="8" fill="#fc6d73" stroke="none"/><rect x="112" y="255" width="16" height="16" rx="8" fill="#edcc66" stroke="none"/><rect x="138" y="255" width="16" height="16" rx="8" fill="#64ce9b" stroke="none"/>
 <text x="176" y="266" fill="#a5c6e5" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" text-anchor="start">READ-ONLY VERIFICATION / SAMPLE OUTPUT</text>
 <text x="105" y="333" fill="#d2e9fe" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="600" text-anchor="start">$ adb shell id</text>
 <text x="105" y="374" fill="#f3c57f" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="600" text-anchor="start">uid=2000(shell) ...</text>
 <text x="105" y="427" fill="#d2e9fe" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="600" text-anchor="start">$ adb shell su -c id</text>
 <text x="105" y="467" fill="#6decbd" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">uid=0(root) ...</text>
 <text x="104" y="529" fill="#9bb0cd" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" text-anchor="start">Output contoh, bukan hasil uji pada perangkat tertentu.</text>
<text x="1198" y="620" fill="#8ba5cb" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="end">ZAIDAN JOURNAL  /  VISUAL GUIDE  /  ILLUSTRATION</text></svg>